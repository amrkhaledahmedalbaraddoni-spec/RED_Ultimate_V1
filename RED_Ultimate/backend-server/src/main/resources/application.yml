server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:-red_user}:${MONGO_PASSWORD:-red_mongo_pass}@db-mongo:27017/red_sovereign?authSource=admin
    redis:
      host: cache-redis
      port: 6379
      password: ${REDIS_PASSWORD:-}

  datasource:
    url: jdbc:postgresql://db-postgres:5432/red_sovereign
    username: ${DB_USER:-red_user}
    password: ${DB_PASSWORD:-password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# RED Sovereign Configuration
red:
  dinstar:
    ip: ${DINSTAR_IP:-192.168.1.100}
    port: ${DINSTAR_PORT:-80}
    auth-token: ${DINSTAR_AUTH_TOKEN:-}

  minio:
    endpoint: http://minio:9000
    access-key: ${MINIO_USER:-redadmin}
    secret-key: ${MINIO_PASSWORD:-redsecret123}
    bucket: red-media

  security:
    jwt-secret: ${JWT_SECRET:-change-me-in-production-please}
    jwt-expiration-ms: 86400000

# Logging
logging:
  level:
    com.red: DEBUG
    org.springframework.web: INFO
