version: '3.8'

services:
  # 1. The Brain: RED Unified Server
  backend:
    build: ./backend-server
    container_name: red-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-postgres:5432/red_sovereign
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATA_MONGODB_URI=mongodb://db-mongo:27017/red
      - REDIS_HOST=cache-redis
      - ASTERISK_AMI_USER=red_admin
      - ASTERISK_AMI_PASSWORD=${AMI_PASSWORD:-red_secret_123}
    depends_on:
      db-postgres: { condition: service_healthy }
      db-mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
    networks: ["red-net"]

  # 2. VoIP/Conference SFU (System A)
  media-sfu:
    build: ./media-sfu
    container_name: red-media-sfu
    ports: ["4000:4000", "40000-40100:40000-40100/udp"]
    networks: ["red-net"]

  # 3. Relay: COTURN
  coturn:
    image: coturn/coturn
    container_name: red-turn
    ports: ["3478:3478", "3478:3478/udp"]
    environment:
      - REALM=red.sovereign
      - SECRET=${TURN_SECRET:-redturnsecret}
    networks: ["red-net"]

  # 4. PSTN Gateway: Asterisk PBX
  pstn-gateway:
    image: andrius/asterisk
    container_name: red-pstn-gateway
    volumes: ["./pstn-asterisk:/etc/asterisk"]
    ports: ["5060:5060/udp", "5038:5038"]
    networks: ["red-net"]

  # 5. Database: PostgreSQL 16
  db-postgres:
    image: postgres:16
    container_name: red-db-sql
    environment:
      - POSTGRES_DB=red_sovereign
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 10s
    networks: ["red-net"]

  # 6. Database: MongoDB 8
  db-mongo:
    image: mongo:8
    container_name: red-db-nosql
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
    networks: ["red-net"]

  # 7. Cache: Redis 7
  cache-redis:
    image: redis:7
    container_name: red-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks: ["red-net"]

  # 8. Storage: MinIO
  minio:
    image: minio/minio
    container_name: red-storage
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      - MINIO_ROOT_USER=redadmin
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-redsecret123}
    volumes: ["minio-data:/data"]
    networks: ["red-net"]

  # 9. Proxy & Admin UI
  nginx:
    image: nginx:alpine
    container_name: red-proxy
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf"]
    depends_on: [backend, admin-panel]
    networks: ["red-net"]

  admin-panel:
    build: ./admin_dashboard
    container_name: red-admin-ui
    networks: ["red-net"]

volumes:
  mongo-data:
  minio-data:

networks:
  red-net:
    driver: bridge
