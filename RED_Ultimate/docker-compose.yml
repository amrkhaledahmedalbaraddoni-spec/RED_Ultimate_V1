# RED Ultimate Sovereign Empire - Docker Compose Ultimate V2
# 13 Core Services + 100% Local, Zero Cloud Dependency
# Version: 2.0.0-ULTIMATE
# Architecture: System A (VoIP 4K), System B (PSTN DINSTAR), System C (Messaging)

version: '3.8'

services:
  # 1. The Brain: RED Unified Sovereign Backend (Spring Boot 3.4 + Kotlin)
  backend:
    build:
      context: ./backend-server
      dockerfile: Dockerfile
    container_name: red-backend
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-postgres:5432/${POSTGRES_DB:-red_sovereign}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-red_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-red_sov_2026_secure}
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_USER:-red_user}:${MONGO_PASSWORD:-red_mongo_secure_2026}@db-mongo:27017/${MONGO_DB:-red_sovereign}?authSource=admin
      - SPRING_DATA_REDIS_HOST=cache-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-red_redis_2026_secure}
      - REDIS_HOST=cache-redis
      - ASTERISK_AMI_USER=${AMI_USER:-red_admin}
      - ASTERISK_AMI_PASSWORD=${AMI_PASSWORD:-red_secret_2026_secure}
      - DINSTAR_IP=${DINSTAR_IP:-192.168.1.100}
      - DINSTAR_PORT=${DINSTAR_PORT:-80}
      - DINSTAR_AUTH_TOKEN=${DINSTAR_AUTH_TOKEN:-}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_USER=${MINIO_USER:-redadmin}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-red_minio_2026_secure}
      - JWT_SECRET=${JWT_SECRET:-RED_SOUVEREIGN_JWT_2026_ULTRA_SECURE_KEY_CHANGE_IN_PROD}
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:+UseG1GC
    depends_on:
      db-postgres:
        condition: service_healthy
      db-mongo:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health", "||", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - red-net
    volumes:
      - backend-logs:/app/logs
    ports:
      - "8080:8080"

  # 2. VoIP/Conference SFU - System A (mediasoup 4K AV1/VP9/H264)
  media-sfu:
    build:
      context: ./media-sfu
      dockerfile: Dockerfile
    container_name: red-media-sfu
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MEDIASOUP_WORKER_BIN=/app/node_modules/mediasoup/worker/out/Release/mediasoup-worker
      - REDIS_HOST=cache-redis
      - BACKEND_URL=http://backend:8080
      - ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-}
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=40100
      - LOG_LEVEL=warn
    ports:
      - "4000:4000"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    depends_on:
      cache-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - red-net
    volumes:
      - sfu-logs:/app/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # 3. NAT Traversal: COTURN (STUN/TURN)
  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: red-turn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --external-ip=$$(detect-external-ip)
      - --min-port=49152
      - --max-port=65535
      - --realm=red.sovereign
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-red_turn_2026_ultra_secure}
      - --no-cli
      - --no-tls
      - --no-dtls
    environment:
      - DETECT_EXTERNAL_IP=yes
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    networks:
      - red-net
    volumes:
      - turn-data:/var/lib/coturn

  # 4. PSTN Gateway: Asterisk PBX - System B (DINSTAR UC2000-VE-8T)
  pstn-gateway:
    build:
      context: ./pstn-asterisk
      dockerfile: Dockerfile
    container_name: red-pstn-gateway
    restart: unless-stopped
    volumes:
      - ./pstn-asterisk:/etc/asterisk
      - asterisk-logs:/var/log/asterisk
      - asterisk-spool:/var/spool/asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5038:5038"
      - "8088:8088"
      - "10000-10100:10000-10100/udp"
    environment:
      - ASTERISK_AMI_USER=${AMI_USER:-red_admin}
      - ASTERISK_AMI_PASSWORD=${AMI_PASSWORD:-red_secret_2026_secure}
      - DINSTAR_IP=${DINSTAR_IP:-192.168.1.100}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - red-net

  # 5. Database: PostgreSQL 16 - Authority & Metadata (System C)
  db-postgres:
    image: postgres:16-alpine
    container_name: red-db-sql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-red_sovereign}
      - POSTGRES_USER=${POSTGRES_USER:-red_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-red_sov_2026_secure}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend-server/src/main/resources/db/migration:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-red_user} -d ${POSTGRES_DB:-red_sovereign}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - red-net
    ports:
      - "5432:5432"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9

  # 6. Database: MongoDB 8 - Messages & Stories (System C - Ultra Fast)
  db-mongo:
    image: mongo:8.0
    container_name: red-db-nosql
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-red_root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-red_root_2026_secure}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-red_sovereign}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./infrastructure/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_ROOT_USER:-red_root}", "-p", "${MONGO_ROOT_PASSWORD:-red_root_2026_secure}", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - red-net
    ports:
      - "27017:27017"

  # 7. Cache & Pub/Sub: Redis 7 (System C - Realtime)
  cache-redis:
    image: redis:7-alpine
    container_name: red-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-red_redis_2026_secure}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD:-red_redis_2026_secure}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - red-net
    ports:
      - "6379:6379"

  # 8. Object Storage: MinIO S3 - Media, Backups, APKs (System C)
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: red-storage
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-redadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-red_minio_2026_secure}
      - MINIO_BROWSER=on
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - red-net
    ports:
      - "9000:9000"
      - "9001:9001"

  # 9. MinIO Setup - Bucket Initialization
  minio-setup:
    image: minio/mc:latest
    container_name: red-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $MINIO_USER $MINIO_PASSWORD;
      /usr/bin/mc mb local/red-media --ignore-existing;
      /usr/bin/mc mb local/red-backups --ignore-existing;
      /usr/bin/mc mb local/red-apks --ignore-existing;
      /usr/bin/mc mb local/red-avatars --ignore-existing;
      /usr/bin/mc anonymous set public local/red-media;
      /usr/bin/mc anonymous set public local/red-apks;
      echo 'RED MinIO Buckets Initialized';
      exit 0;
      "
    environment:
      - MINIO_USER=${MINIO_USER:-redadmin}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-red_minio_2026_secure}
    networks:
      - red-net

  # 10. Reverse Proxy & Security Gateway: NGINX Ultimate
  nginx:
    image: nginx:1.27-alpine
    container_name: red-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx-certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      admin-panel:
        condition: service_started
      media-sfu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - red-net

  # 11. Admin Dashboard - RED Sovereign Master Control (React 19 + Ant Design)
  admin-panel:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    container_name: red-admin-ui
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:80/api
      - REACT_APP_WS_URL=ws://localhost:80/ws
      - REACT_APP_SFU_URL=ws://localhost:4000
      - REACT_APP_VERSION=2.0.0-ULTIMATE
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 12. Monitoring: Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: red-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - red-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 13. Visualization: Grafana - RED Master Metrics Dashboard
  grafana:
    image: grafana/grafana:11.4.0
    container_name: red-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-redadmin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-red_grafana_2026_secure}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infrastructure/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - red-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  backend-logs:
    driver: local
  sfu-logs:
    driver: local
  asterisk-logs:
    driver: local
  asterisk-spool:
    driver: local
  nginx-logs:
    driver: local
  turn-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  red-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
