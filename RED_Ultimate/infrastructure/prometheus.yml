global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'red-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'red-sfu'
    static_configs:
      - targets: ['media-sfu:4000']
    metrics_path: '/stats'
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['db-postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['cache-redis:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
