; RED Sovereign Unified - Dialplan
; System B - PSTN Routing via DINSTAR UC2000-VE-8T
; Yemen Mobile / Sabafon / YOU / Y Telecom
; Merged: Sovereign security (backend-authorized) + Ultimate Yemen formats + 4K VoIP/Conference hints
; 100% Local - AMI originates only after backend validates Yemeni numbers, limits, and approval

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
DINSTAR_TRUNK=dinstar-gateway
RED_BACKEND=http://backend:8080
DINSTAR_IP=192.168.11.1

[from-red-backend]
; AMI originates only Local channels into this context. Backend validates Yemeni numbers and limits first.
; Unified: supports Yemen short 7XXXXXXXX, international 9677XXXXXXXX, 009677XXXXXXXX, all normalized to PJSIP dial
; Inherits sovereign security - every call is CDR-tagged and optionally recorded

; Yemen short format (7XXXXXXXX - 9 digits starting with 7)
exten => _7XXXXXXXX,1,NoOp(🔴 RED Sovereign: Authorized DINSTAR call to Yemen ${EXTEN} via System B)
 same => n,Set(CDR(userfield)=RED_DINSTAR)
 same => n,Set(CALLERID(num)=${IF($[${LEN(${CALLERID(num)})} > 3]?${CALLERID(num)}:1000)})
 same => n,MixMonitor(/var/log/asterisk/red-pstn-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav)
 same => n,Dial(PJSIP/${EXTEN}@dinstar-gateway,60,tT)
 same => n,NoOp(Dial status ${DIALSTATUS})
 same => n,Hangup()

; Yemen with country code 9677XXXXXXXX
exten => _9677XXXXXXXX,1,NoOp(RED: Yemen Mobile 967 format ${EXTEN} - normalized)
 same => n,Set(CDR(userfield)=RED_DINSTAR)
 same => n,Dial(PJSIP/${EXTEN}@dinstar-gateway,60,tT)
 same => n,Hangup()

; Yemen with 00967 prefix
exten => _009677XXXXXXXX,1,NoOp(RED: Yemen 00967 format ${EXTEN} - normalized strip 00967)
 same => n,Set(CDR(userfield)=RED_DINSTAR)
 same => n,Dial(PJSIP/${EXTEN:5}@dinstar-gateway,60,tT)
 same => n,Hangup()

; Generic fallback for any authorized backend-originated number (keeps sovereign compatibility)
exten => _X.,1,NoOp(Authorized RED DINSTAR call to ${EXTEN} - generic)
 same => n,Set(CDR(userfield)=RED_DINSTAR)
 same => n,Dial(PJSIP/${EXTEN}@dinstar-gateway,60)
 same => n,Hangup()

[from-dinstar]
; Incoming GSM routing is deliberately CLOSED until an authenticated Android recipient mapping exists.
; Ultimate had permissive inbound to PJSIP/webrtc-client; sovereign blocks it. Unified keeps block but logs.
exten => _X.,1,NoOp(⛔ Blocked unmapped incoming DINSTAR call from ${CALLERID(num)} to ${EXTEN} - no recipient mapping)
 same => n,Hangup(21)
exten => s,1,NoOp(⛔ Blocked unmapped incoming DINSTAR call from ${CALLERID(num)} - no recipient)
 same => n,Hangup(21)

[from-red-client]
; PSTN is backend-authorized only. A registered SIP/WebRTC client cannot dial the gateway directly.
; System A (SFU WebRTC) never enters Asterisk - pure P2P/SFU, not PSTN.
exten => _X.,1,NoOp(⛔ Blocked direct client PSTN attempt from ${CALLERID(num)} to ${EXTEN} - use backend AMI)
 same => n,Hangup(21)

; --- Optional services (from Ultimate) - kept but still require backend auth or are local-only ---
; Internal extension dialing (WebRTC - System A) - local test only, not sovereign route
; exten => _1XXX,1,NoOp(RED Internal VoIP ${EXTEN} - System A - local test)
;  same => n,Dial(PJSIP/${EXTEN},30,tT)
;  same => n,Hangup()

; Conference via SFU bridge - prefer SFU (media-sfu) for 4K, not Asterisk ConfBridge
; exten => _6XXX,1,NoOp(RED Conference ${EXTEN} via SFU System A - prefer mediasoup)
;  same => n,Answer()
;  same => n,ConfBridge(${EXTEN},red_conference_bridge,red_conference_user)
;  same => n,Hangup()

; Echo test for System A - media-sfu test alternative
exten => *43,1,NoOp(RED Echo Test System A - local)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Voicemail - local only
exten => *100,1,NoOp(RED Voicemail - local)
 same => n,VoiceMailMain(@red-voicemail)
 same => n,Hangup()
