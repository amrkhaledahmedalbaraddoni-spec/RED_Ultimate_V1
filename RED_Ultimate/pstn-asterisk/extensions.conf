; RED Ultimate Sovereign - Dialplan Ultimate V2
; System B - PSTN Routing via DINSTAR UC2000-VE-8T
; Yemen Mobile / Sabafon / YOU / Y Telecom

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
DINSTAR_TRUNK=dinstar-gateway
RED_BACKEND=http://backend:8080
DINSTAR_IP=192.168.1.100

[from-internal]
; Internal RED users calling PSTN via Dinstar
exten => _7XXXXXXXX,1,NoOp(RED Sovereign: PSTN Call to ${EXTEN} via Dinstar System B)
 same => n,Set(CALLERID(num)=${IF($[${LEN(${CALLERID(num)})} > 3]?${CALLERID(num)}:1000)})
 same => n,Set(CDR(userfield)=RED-PSTN-OUT)
 same => n,MixMonitor(/var/log/asterisk/red-pstn-${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav)
 same => n,Dial(PJSIP/${EXTEN}@dinstar-gateway,60,tT)
 same => n,NoOp(Dial status ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
 same => n(busy),Hangup()
 same => n(unavail),Hangup()

; Yemen numbers with country code
exten => _9677XXXXXXXX,1,NoOp(RED: Yemen Mobile 967 format ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN:3}@dinstar-gateway,60,tT)
 same => n,Hangup()

exten => _009677XXXXXXXX,1,NoOp(RED: Yemen 00967 format ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN:5}@dinstar-gateway,60,tT)
 same => n,Hangup()

; Internal extension dialing (WebRTC - System A)
exten => _1XXX,1,NoOp(RED Internal VoIP ${EXTEN} - System A)
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; Conference via SFU bridge
exten => _6XXX,1,NoOp(RED Conference ${EXTEN} via SFU System A)
 same => n,Answer()
 same => n,ConfBridge(${EXTEN},red_conference_bridge,red_conference_user)
 same => n,Hangup()

[from-dinstar]
; Incoming GSM calls from Dinstar to RED App
exten => s,1,NoOp(🔴 RED System B: Incoming GSM Call from Dinstar ${CALLERID(all)})
 same => n,Set(CDR(userfield)=RED-PSTN-IN)
 same => n,Set(CALLERID(name)=GSM:${CALLERID(num)})
 same => n,NoOp(Incoming from ${CALLERID(num)} to ${EXTEN})
 ; Try to route to WebRTC client - broadcast to all online via ARI or dial
 same => n,Dial(PJSIP/webrtc-client,30,tT)
 same => n,Hangup()

exten => _X.,1,NoOp(RED Dinstar incoming ${EXTEN} CID ${CALLERID(num)})
 same => n,Goto(from-dinstar,s,1)

[from-pstn]
; Legacy PSTN inbound
exten => s,1,Goto(from-dinstar,s,1)

; Emergency
exten => 911,1,NoOp(RED Emergency)
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; RED Services
exten => *100,1,NoOp(RED Voicemail)
 same => n,VoiceMailMain(@red-voicemail)
 same => n,Hangup()

; Echo test for System A
exten => *43,1,NoOp(RED Echo Test System A)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
