[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = yes
timestampevents = yes
allowmultiplelogin = yes

[red_admin]
secret = red_secret_2026_secure_ultra
deny=0.0.0.0/0.0.0.0
permit=172.28.0.0/16
permit=192.168.0.0/16
