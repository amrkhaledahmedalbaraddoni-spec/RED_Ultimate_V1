displayconnects = yes

[red_backend]
secret = red_backend_ami_2026_secure
deny=0.0.0.0/0.0.0.0
permit=172.28.0.0/16
read = all
write = all,originate,call,reporting

[red_monitor]
secret = red_monitor_2026
deny=0.0.0.0/0.0.0.0
permit=172.28.0.0/16
read = system,call,log,verbose,agent,user,config,dtmf,reporting,cdr,dialplan
write = 
