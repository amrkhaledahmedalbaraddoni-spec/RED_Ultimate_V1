[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.28.0.0/16
local_net=192.168.0.0/16
external_media_address=172.28.0.10
external_signaling_address=172.28.0.10

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; ==================== DINSTAR GATEWAY - 8 SIM Slots ====================
; Contact DINSTAR UC2000-VE-8T at 192.168.1.100
[dinstar-gateway]
type=aor
contact=sip:192.168.1.100:5060
max_contacts=10
qualify_frequency=30
qualify_timeout=10.0

[dinstar-gateway]
type=endpoint
context=from-dinstar
disallow=all
allow=g729,alaw,ulaw,gsm,opus
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
timers=yes
timers_min_se=90
ice_support=no
use_avpf=no
media_encryption=no
trust_id_inbound=yes
send_rpid=yes
send_pai=yes
callerid=RED Sovereign <1000>

[dinstar-gateway]
type=identify
endpoint=dinstar-gateway
match=192.168.1.100
match=192.168.1.0/24

[dinstar-gateway-auth]
type=auth
auth_type=userpass
username=dinstar
password=red_dinstar_2026

; ==================== WebRTC Clients - App Bridge ====================
[webrtc-client]
