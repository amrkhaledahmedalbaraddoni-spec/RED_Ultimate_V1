[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; الربط مع جهاز DINSTAR الفيزيائي
[dinstar-gateway]
type=aor
contact=sip:192.168.1.100:5060 ; قم بتعديل هذا لعنوان IP جهاز Dinstar الحقيقي

[dinstar-gateway]
type=endpoint
context=from-internal
disallow=all
allow=g729,alaw,ulaw,gsm ; تقديم g729 للأداء الأفضل في اليمن
direct_media=no
force_rport=yes
rewrite_contact=yes

[dinstar-gateway]
type=identify
endpoint=dinstar-gateway
match=192.168.1.100

; تعريف التطبيق كمستخدم SIP داخلي (WebRTC Bridge)
[webrtc-client]
type=endpoint
context=from-internal
disallow=all
allow=opus,vp9,av1
webrtc=yes
dtls_auto_self_signed=yes
ice_support=yes
use_avpf=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=webrtc-auth
aors=webrtc-client

[webrtc-auth]
type=auth
auth_type=password
password=red_secure_pass
username=webrtc-client

[webrtc-client]
type=aor
max_contacts=5
