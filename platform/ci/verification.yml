# RED verification pipeline — intended contents for .github/workflows/verification.yml
# Copy this file there once the repository token is allowed to edit workflows.
name: RED verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  separation-guard:
    name: Separation + integration contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the three planes are separated and integrated
        run: python3 tools/guard/separation_guard.py --verbose

  compose-contract:
    name: Compose matches the runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render a throw-away environment from the contract
        run: python3 tools/env/render_env.py --server-ip 127.0.0.1
      - name: Validate the compose file
        run: >-
          docker compose --env-file platform/config/.env
          -f platform/compose/docker-compose.yml config --quiet

  verification-image:
    name: Build and test every plane
    runs-on: ubuntu-latest
    needs: separation-guard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend, Android APK, admin, SFU and PSTN config
        run: >-
          docker build . --file platform/containers/ci.Dockerfile
          --tag red-verification:${{ github.sha }}
