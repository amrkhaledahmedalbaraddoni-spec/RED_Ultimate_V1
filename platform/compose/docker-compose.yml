# ============================================================================
# RED Ultimate — Runtime plane (infrastructure only)
#
# This file describes HOW the stack runs. It contains no application source and
# no data. Sources live in ../../services, schema/seeds live in ../../data.
#
# Always run it through the single entry point so the env file is resolved:
#   tools/scripts/red.sh up
# or explicitly:
#   docker compose --env-file platform/config/.env \
#     -f platform/compose/docker-compose.yml up -d
#
# IPAM/ports/volumes here mirror contracts/stack.json (checked by
# tools/guard/separation_guard.py). Change the contract first, then this file.
# ============================================================================
name: red-sovereign

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped
  logging: *default-logging

services:
  # ── Application services ──────────────────────────────────────────────────
  # 1. Backend API + WebSocket signalling (source: services/backend)
  backend:
    <<: *default-restart
    build:
      context: ../..
      dockerfile: platform/containers/backend.Dockerfile
      args:
        DATA_PLANE: data
    container_name: red-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-postgres:5432/${POSTGRES_DB:-red_sovereign}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER:-red_user}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@db-mongo:27017/${MONGO_DB:-red_sovereign}?authSource=admin
      SPRING_DATA_REDIS_HOST: cache-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_HOST: cache-redis
      ASTERISK_AMI_HOST: pstn-gateway
      ASTERISK_AMI_USER: ${AMI_USER:-red_admin}
      ASTERISK_AMI_PASSWORD: ${AMI_PASSWORD:?AMI_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RED_ADMIN_USERNAME: ${RED_ADMIN_USERNAME:?RED_ADMIN_USERNAME is required}
      RED_ADMIN_PASSWORD: ${RED_ADMIN_PASSWORD:?RED_ADMIN_PASSWORD is required}
      DINSTAR_USERNAME: ${DINSTAR_USERNAME:?DINSTAR_USERNAME is required}
      DINSTAR_PASSWORD: ${DINSTAR_PASSWORD:?DINSTAR_PASSWORD is required}
      DINSTAR_IP: ${DINSTAR_IP:-192.168.11.1}
      DINSTAR_PORT: ${DINSTAR_PORT:-80}
      DINSTAR_SCHEME: ${DINSTAR_SCHEME:-http}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: ${MINIO_USER:-redadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      RED_IDENTITY_PRIVATE_KEY_PATH: /run/secrets/red_identity_private_key.pem
      RED_IDENTITY_PUBLIC_KEY_PATH: /run/secrets/red_identity_public_key.pem
      REFRESH_EXPIRATION_DAYS: ${REFRESH_EXPIRATION_DAYS:-30}
      RED_DEVICE_CERTIFICATE_VALID_DAYS: ${RED_DEVICE_CERTIFICATE_VALID_DAYS:-90}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET is required}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST:-127.0.0.1}
      TURN_PORT: "3478"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g -XX:+UseG1GC}
    volumes:
      - ../secrets:/run/secrets:ro
      - backend-logs:/app/logs
    depends_on:
      db-postgres: { condition: service_healthy }
      db-mongo: { condition: service_healthy }
      cache-redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    networks: [red-net]

  # 2. WebRTC SFU (source: services/media-sfu)
  media-sfu:
    <<: *default-restart
    build:
      context: ../..
      dockerfile: platform/containers/sfu.Dockerfile
    container_name: red-media-sfu
    environment:
      NODE_ENV: production
      PORT: "4000"
      MEDIASOUP_WORKER_BIN: /app/node_modules/mediasoup/worker/out/Release/mediasoup-worker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?MEDIASOUP_ANNOUNCED_IP is required}
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-2}
      RTC_MIN_PORT: "40000"
      RTC_MAX_PORT: "40100"
      BACKEND_URL: http://backend:8080
      LOG_LEVEL: ${SFU_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:4000:4000"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - sfu-logs:/app/logs
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [red-net]

  # 3. Admin dashboard (source: services/admin-dashboard) — static SPA behind nginx
  admin-panel:
    <<: *default-restart
    build:
      context: ../..
      dockerfile: platform/containers/admin.Dockerfile
    container_name: red-admin-ui
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [red-net]

  # ── Telephony ─────────────────────────────────────────────────────────────
  # 4. PSTN gateway (config: platform/telephony) → DINSTAR UC2000-VE-8T
  pstn-gateway:
    <<: *default-restart
    build:
      context: ../telephony
      dockerfile: ../containers/pstn.Dockerfile
    container_name: red-pstn-gateway
    environment:
      AMI_PASSWORD: ${AMI_PASSWORD:?AMI_PASSWORD is required}
      AMI_USER: ${AMI_USER:-red_admin}
      DINSTAR_IP: ${DINSTAR_IP:-192.168.11.1}
    volumes:
      - ../telephony:/etc/asterisk:ro
      - asterisk-logs:/var/log/asterisk
      - asterisk-spool:/var/spool/asterisk
    ports:
      # SIP towards DINSTAR on the LAN — required for the gateway to register.
      - "5060:5060/udp"
      - "5060:5060/tcp"
      # RTP media range used by the DINSTAR gateway.
      - "10000-10100:10000-10100/udp"
      # AMI (5038) is intentionally NOT published: only the backend may reach it.
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend: { condition: service_healthy }
    networks: [red-net]

  # 5. TURN/STUN for RED voice/video (NAT traversal only)
  coturn:
    <<: *default-restart
    image: coturn/coturn:4.6.2-alpine
    container_name: red-turn
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --realm=red.sovereign
      - --min-port=45000
      - --max-port=45050
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "45000-45050:45000-45050/udp"
    volumes:
      - turn-data:/var/lib/coturn
    networks: [red-net]

  # ── Data services (schema owned by /data, not by the images) ──────────────
  # 6. PostgreSQL — identities, approval, refresh sessions, audit, pre-keys
  db-postgres:
    <<: *default-restart
    image: postgres:16-alpine
    container_name: red-db-sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-red_sovereign}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema is applied by Flyway (data/sql/migrations packaged in the backend jar).
      # Mounting migrations into docker-entrypoint-initdb.d would apply them twice.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-red_sovereign}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - "127.0.0.1:5432:5432"
    networks: [red-net]

  # 7. MongoDB — ciphertext messages, sequences, social graph, stories
  db-mongo:
    <<: *default-restart
    image: mongo:8.0
    container_name: red-db-nosql
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-red_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-red_sovereign}
      # Consumed by data/mongo/init.js (first initialization only). No secret is
      # stored in Git: the value comes from platform/config/.env.
      MONGO_APP_USER: ${MONGO_USER:-red_user}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_APP_DB: ${MONGO_DB:-red_sovereign}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ../../data/mongo/init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_ROOT_USER:-red_root}", "-p", "${MONGO_ROOT_PASSWORD:?}", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "127.0.0.1:27017:27017"
    networks: [red-net]

  # 8. Redis — rate limits, PSTN counters, short-lived state
  cache-redis:
    <<: *default-restart
    image: redis:7-alpine
    container_name: red-cache
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    networks: [red-net]

  # 9. MinIO — local object storage for media and backups
  minio:
    <<: *default-restart
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: red-storage
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-redadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # S3 endpoint stays reachable on the LAN for pre-signed media URLs.
      - "9000:9000"
      # Console is local-machine only.
      - "127.0.0.1:9001:9001"
    networks: [red-net]

  # 10. One-shot bucket bootstrap (data plane seed, no public buckets)
  minio-setup:
    image: minio/mc:latest
    container_name: red-minio-setup
    restart: "no"
    logging: *default-logging
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_USER: ${MINIO_USER:-redadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" >/dev/null
        for bucket in red-media red-backups red-apks red-avatars; do
          mc mb --ignore-existing "local/$$bucket" >/dev/null
          mc anonymous set none "local/$$bucket" >/dev/null
        done
        echo "RED buckets ready (private; access is pre-signed by the backend)"
    networks: [red-net]

  # ── Edge / observability ──────────────────────────────────────────────────
  # 11. Nginx gateway (config: platform/proxy/nginx.conf)
  nginx:
    <<: *default-restart
    image: nginx:1.27-alpine
    container_name: red-proxy
    ports:
      # TLS is a deployment concern: terminate it in front of this gateway and
      # point tools/scripts/red.sh at the certificate store (platform/proxy/certs).
      - "${RED_HTTP_PORT:-80}:80"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../proxy/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend: { condition: service_healthy }
      admin-panel: { condition: service_started }
      media-sfu: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [red-net]

  # 12. Prometheus (config: platform/monitoring/prometheus.yml)
  prometheus:
    <<: *default-restart
    image: prom/prometheus:v3.0.1
    container_name: red-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-200h}
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [red-net]

  # 13. Grafana (provisioning: platform/monitoring/grafana)
  grafana:
    <<: *default-restart
    image: grafana/grafana:11.4.0
    container_name: red-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-redadmin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
      prometheus: { condition: service_healthy }
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [red-net]

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  redis-data:
  minio-data:
  backend-logs:
  sfu-logs:
  asterisk-logs:
  asterisk-spool:
  nginx-logs:
  turn-data:
  prometheus-data:
  grafana-data:

networks:
  red-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
