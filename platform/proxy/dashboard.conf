# RED admin dashboard — static SPA container.
# This server knows nothing about the backend: /api and /ws are routed by the edge
# gateway (platform/proxy/nginx.conf). Keeping it SPA-only preserves the separation
# between the application plane and the routing plane.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "RED ADMIN OK\n";
    }
}
